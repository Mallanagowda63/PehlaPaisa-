# Builds and tests PehlaPaisa for both stores on every push / pull request.
# iOS can only be compiled on macOS, so that job runs on GitHub's Mac runner.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  test:
    name: Analyze + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android (Play Store bundle)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Without android/key.properties (never committed) the release build is
      # signed with the debug key: fine for checking it compiles. Upload the
      # bundle built on your own machine, signed with the upload key.
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-bundle
          path: build/app/outputs/bundle/release/app-release.aab

  ios:
    name: iOS (App Store build check)
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Compiles the full iOS app without signing. For the App Store, build
      # an archive in Xcode (or `flutter build ipa`) with your Apple account.
      - run: flutter build ios --release --no-codesign
